version: '3.9'
services:
  mariadb:
    image: mariadb:11.4
    container_name: docbridge-db
    environment:
      MYSQL_ROOT_PASSWORD:
      MYSQL_DATABASE: docbridge
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - internal

  elasticsearch:
    image: elasticsearch:8.13.4
    container_name: docbridge-es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - internal

  kibana:
    image: kibana:8.13.0  # match version Elasticsearch đang dùng
    ports:
      - "5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    networks:
      - internal
    depends_on:
      - elasticsearch

networks:
  internal:
    driver: bridge

volumes:
  mariadb_data:
  es_data: